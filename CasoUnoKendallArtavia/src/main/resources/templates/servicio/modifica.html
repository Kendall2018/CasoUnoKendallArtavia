<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Servicio</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>

<header th:replace="~{fragmentos :: header}"></header>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container mt-4">
    <h2>Modificar Servicio</h2>

    <form th:action="@{/servicio/guardar}" method="post" th:object="${servicio}">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select name="idCategoria" class="form-select" required>
                <option value="">Seleccione una categoría</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombre}"
                        th:selected="${servicio.categoria.id == categoria.id}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/servicio/listado}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>

<footer th:replace="~{fragmentos :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
