<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Servicios</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>

<header th:replace="~{fragmentos :: header}"></header>
<nav th:replace="~{fragmentos :: navbar}"></nav>

<main class="container mt-4">
    <h2>Listado de Servicios</h2>

    <div th:if="${todoOk}" class="alert alert-success" th:text="${todoOk}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/servicio/guardar}" method="post" class="row g-3 mb-4">
        <div class="col-md-4">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre del servicio" required>
        </div>

        <div class="col-md-3">
            <input type="number" step="0.01" name="precio" class="form-control" placeholder="Precio" required>
        </div>

        <div class="col-md-3">
            <select name="idCategoria" class="form-select" required>
                <option value="">Seleccione categoría</option>
                <option th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nombre}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <button type="submit" class="btn btn-success w-100">Agregar</button>
        </div>
    </form>

    <p>Total de servicios: <span th:text="${totalServicios}"></span></p>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Servicio</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Modificar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="servicio : ${servicios}">
                <td th:text="${servicio.id}"></td>
                <td th:text="${servicio.nombre}"></td>
                <td th:text="${servicio.precio}"></td>
                <td th:text="${servicio.categoria.nombre}"></td>
                <td>
                    <a class="btn btn-warning btn-sm"
                       th:href="@{/servicio/modificar/{idServicio}(idServicio=${servicio.id})}">
                        Modificar
                    </a>
                </td>
                <td>
                    <form th:action="@{/servicio/eliminar}" method="post">
                        <input type="hidden" name="idServicio" th:value="${servicio.id}">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragmentos :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
